name: CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint

  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npm run lint

  typecheck-backend:
    name: Typecheck (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npm run typecheck

  build-frontend:
    name: Build (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key

  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npm test

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action reads the PR's commit list, which needs pull-requests: read.
    # The workflow-level default (contents: read) is not enough on its own.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Blocking: a committed secret must fail CI before it reaches main.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  guard-invoices-balance:
    name: Guard invoices.balance writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block any code path that writes invoices.balance
        run: python3 .github/scripts/guard_invoices_balance.py

  guard-jurisdiction-resolution:
    name: Guard jurisdiction resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block direct reads of tenant/branch jurisdiction outside the jurisdiction module
        run: python3 .github/scripts/guard_jurisdiction_resolution.py
      - name: Prove the guard with fixture tests
        run: python3 .github/scripts/test_guard_jurisdiction_resolution.py

  guard-country-literals:
    name: Guard country-specific literals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block Saudi/GCC-specific literals outside packs and migrations
        run: python3 .github/scripts/guard_country_literals.py

  guard-pack-imports:
    name: Guard pack imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block direct imports of packs/sa, packs/ae or packs/qa outside packs and tests
        run: python3 .github/scripts/guard_pack_imports.py

  guard-frontend-nationality:
    name: Guard frontend nationality classification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block frontend comparisons against 'saudi', 'Saudi', or 'سعودي'
        run: python3 .github/scripts/guard_frontend_nationality.py

  guard-hardcoded-currency:
    name: Guard hardcoded currency literals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block hardcoded SAR/AED/QAR/ريال/ر.س/د.إ/ر.ق in frontend/src
        run: python3 .github/scripts/guard_hardcoded_currency.py

  guard-schema-drift:
    name: Guard schema drift in frontend queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block unknown table names or no-arg .order() in tenantQuery/supabase.from calls
        run: python3 .github/scripts/guard_schema_drift.py
      - name: Prove the guard with fixture tests
        run: python3 .github/scripts/test_guard_schema_drift.py

  guard-rls-migrations:
    name: Guard legacy RLS patterns in migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block legacy current_setting/auth.jwt() ->> 'tenant_id' tenant-isolation patterns
        run: python3 .github/scripts/guard_rls_migrations.py

  guard-frontend-query-tables:
    name: Guard frontend query table existence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Block useQuery/useTenantQuery/useTableQuery against non-existent tables unless disabled
        run: node .github/scripts/guard_frontend_query_tables.cjs

  dependency-audit:
    name: Dependency Audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Advisory (non-blocking): surfaces known CVEs at high+ severity without
      # blocking merges on unfixable transitive advisories. Review the summary.
      - name: npm audit (frontend)
        run: cd frontend && npm audit --audit-level=high || true
      - name: npm audit (backend)
        run: cd backend && npm audit --audit-level=high || true
