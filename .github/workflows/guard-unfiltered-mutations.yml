name: Guard unfiltered frontend mutations

on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - '.github/scripts/guard_unfiltered_mutations.py'
      - '.github/scripts/test_guard_unfiltered_mutations.py'
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - '.github/scripts/guard_unfiltered_mutations.py'
      - '.github/scripts/test_guard_unfiltered_mutations.py'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run guard unit test
        run: python3 .github/scripts/test_guard_unfiltered_mutations.py

      - name: Get changed frontend files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          files=$(git diff --name-only --diff-filter=AM "$BASE" HEAD | grep -E '^frontend/src/.*\.(js|jsx|ts|tsx)$' || true)
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Run guard on changed files
        if: steps.changed.outputs.files != ''
        run: |
          python3 .github/scripts/guard_unfiltered_mutations.py --files ${{ steps.changed.outputs.files }}
